services:
  - type: web
    name: triage-desk-mehedi
    runtime: node
    plan: free
    region: singapore
    branch: main
    autoDeployTrigger: "off"
    buildCommand: npm ci --include=dev --ignore-scripts && npm run build
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: DEMO_DAILY_LIMIT
        value: "25"
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_API_KEY
        sync: false
      - key: MONGODB_URI
        sync: false
